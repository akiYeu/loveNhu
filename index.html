<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anh Yêu Em ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at center, #2a0a1a 0%, #1a0010 50%, #000 100%);
    font-family: 'Segoe UI', sans-serif;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  .content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
    width: 100%;
  }
  .love-text {
    font-size: clamp(2rem, 8vw, 5rem);
    color: #fff;
    text-shadow:
      0 0 10px #ff9ec7,
      0 0 20px #ff9ec7,
      0 0 40px #ff69b4,
      0 0 80px #ff69b4,
      0 0 120px #ff69b4;
    letter-spacing: 6px;
    font-weight: bold;
    animation: textPulse 2s ease-in-out infinite;
    margin-bottom: 20px;
  }
  .sub-text {
    font-size: clamp(1rem, 4vw, 2rem);
    color: #ffcce0;
    letter-spacing: 4px;
    text-shadow:
      0 0 10px #ff9ec7,
      0 0 30px #ff69b4;
    animation: fadeIn 3s ease-in-out infinite;
  }
  @keyframes textPulse {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  @keyframes fadeIn {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="content">
    <h1 class="love-text">Anh Yêu Em</h1>
    <p class="sub-text">Love Như</p>
  </div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H, CX, CY, HEART_SCALE;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2 + H * 0.05;
  HEART_SCALE = Math.min(W, H) / 32;
}
resize();
window.addEventListener('resize', () => { resize(); buildHeartPoints(); });

// ===== Hàm tạo hình trái tim =====
function heartPoint(t, scale) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x: CX + x * scale, y: CY - y * scale };
}

// ===== Điểm đích tạo trái tim =====
let heartPoints = [];
const TOTAL_POINTS = 400; // nhiều hạt hơn cho chi tiết

function buildHeartPoints() {
  heartPoints = [];
  // Tạo viền trái tim (dày)
  for (let i = 0; i < TOTAL_POINTS; i++) {
    const t = (i / TOTAL_POINTS) * Math.PI * 2;
    const p = heartPoint(t, HEART_SCALE);
    heartPoints.push(p);
  }
  // Tạo thêm hạt bên trong trái tim (fill)
  for (let i = 0; i < TOTAL_POINTS * 0.6; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = Math.random() * 0.9;
    const x = 16 * Math.pow(Math.sin(t), 3) * r;
    const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * r;
    heartPoints.push({ x: CX + x * HEART_SCALE, y: CY - y * HEART_SCALE });
  }
}
buildHeartPoints();

// ===== Hạt =====
class Particle {
  constructor(target) {
    this.target = target;
    // Bay từ ngoài màn hình (mọi hướng) - kiểu vạn kiếm quy tông
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.max(W, H) * (1.2 + Math.random() * 1.5);
    this.x = CX + Math.cos(angle) * dist;
    this.y = CY + Math.sin(angle) * dist;
    this.vx = 0;
    this.vy = 0;
    this.size = Math.random() * 2.5 + 1;
    // Màu hồng nhạt
    const hue = 330 + Math.random() * 20;
    const light = 75 + Math.random() * 20;
    this.color = `hsl(${hue}, 100%, ${light}%)`;
    this.arrived = false;
    this.fadeTimer = Math.random() * Math.PI * 2;
  }

  update() {
    if (!this.arrived) {
      const dx = this.target.x - this.x;
      const dy = this.target.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Lực hút mạnh (vạn kiếm quy tông)
      const force = 0.0035;
      this.vx += dx * force;
      this.vy += dy * force;

      // Tăng tốc theo thời gian
      this.vx *= 1.02;
      this.vy *= 1.02;

      // Giới hạn tốc độ tối đa
      const maxSpeed = 25;
      const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }

      this.x += this.vx;
      this.y += this.vy;

      if (dist < 4) {
        this.arrived = true;
      }
    } else {
      // Sau khi đến đích, dao động nhẹ
      this.fadeTimer += 0.06;
      this.x = this.target.x + Math.sin(this.fadeTimer) * 1.8;
      this.y = this.target.y + Math.cos(this.fadeTimer * 1.3) * 1.8;
    }
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = this.color;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

const particles = heartPoints.map(p => new Particle(p));

// ===== Vệt sáng bay theo hạt =====
function drawTrail(p) {
  if (p.arrived) return;
  const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
  if (speed < 2) return;
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x - p.vx * 1.5, p.y - p.vy * 1.5);
  ctx.strokeStyle = p.color;
  ctx.lineWidth = p.size * 0.8;
  ctx.globalAlpha = 0.4;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ===== Hạt nền =====
const ambient = [];
for (let i = 0; i < 60; i++) {
  ambient.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() * 1.5 + 0.5,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    color: `hsl(${330 + Math.random() * 20}, 100%, ${80 + Math.random() * 15}%)`
  });
}

// ===== Vòng lặp =====
function animate() {
  // Xóa mờ để tạo vệt
  ctx.fillStyle = 'rgba(10, 0, 8, 0.25)';
  ctx.fillRect(0, 0, W, H);

  // Hạt nền
  for (const p of ambient) {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H;
    if (p.y > H) p.y = 0;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = 0.5;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Vệt sáng + hạt chính
  for (const p of particles) {
    drawTrail(p);
    p.update();
    p.draw();
  }

  requestAnimationFrame(animate);
}
animate();

// ===== Click tạo tim bay =====
document.addEventListener('click', (e) => {
  for (let i = 0; i < 12; i++) {
    const heart = document.createElement('div');
    heart.textContent = '❤️';
    heart.style.position = 'fixed';
    heart.style.left = e.clientX + 'px';
    heart.style.top = e.clientY + 'px';
    heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
    heart.style.pointerEvents = 'none';
    heart.style.zIndex = '999';
    heart.style.transition = 'all 1.5s ease-out';
    heart.style.opacity = '1';
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.style.transform = `translate(${(Math.random() - 0.5) * 400}px, -${Math.random() * 400 + 100}px) scale(0) rotate(${Math.random() * 720}deg)`;
      heart.style.opacity = '0';
    }, 10);

    setTimeout(() => heart.remove(), 1500);
  }
});
</script>
</body>
</html>
