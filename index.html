<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anh Yêu Em ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', sans-serif;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .content {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; z-index: 10;
    pointer-events: none; width: 100%;
  }
  .love-text {
    font-size: clamp(2rem, 8vw, 5rem);
    color: #fff;
    text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4, 0 0 40px #ff69b4, 0 0 80px #ff69b4;
    letter-spacing: 6px; font-weight: bold;
    animation: textPulse 2s ease-in-out infinite;
    margin-bottom: 20px;
  }
  .sub-text {
    font-size: clamp(1rem, 4vw, 2rem);
    color: #ffb6d9; letter-spacing: 4px;
    text-shadow: 0 0 10px #ff69b4, 0 0 30px #ff69b4;
    animation: fadeIn 3s ease-in-out infinite;
  }
  @keyframes textPulse {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  @keyframes fadeIn {
    0%, 100% { opacity: 0.6; } 50% { opacity: 1; }
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="content">
    <h1 class="love-text">Anh Yêu Em</h1>
    <p class="sub-text">Love Như</p>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let width, height, cx, cy, heartScale;

// ===== Hàm tạo hình trái tim =====
function heartPoint(t, scale) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return { x: x * scale, y: -y * scale };
}

// ===== Tạo danh sách điểm đích (trái tim) =====
let heartTargets = [];
const TARGET_COUNT = 800; // số điểm tụ

function buildTargets() {
  heartTargets = [];
  // Viền trái tim
  for (let i = 0; i < TARGET_COUNT * 0.7; i++) {
    const t = (i / (TARGET_COUNT * 0.7)) * Math.PI * 2;
    const p = heartPoint(t, heartScale);
    // Thêm chút nhiễu để tự nhiên
    heartTargets.push({
      x: cx + p.x + (Math.random() - 0.5) * 8,
      y: cy + p.y + (Math.random() - 0.5) * 8
    });
  }
  // Bên trong trái tim (fill)
  for (let i = 0; i < TARGET_COUNT * 0.3; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = Math.random() * 0.85;
    const x = 16 * Math.pow(Math.sin(t), 3) * r;
    const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * r;
    heartTargets.push({
      x: cx + x * heartScale,
      y: cy + y * heartScale
    });
  }
}

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cx = width / 2;
  cy = height / 2;
  heartScale = Math.min(width, height) / 24; // trái tim to
  buildTargets();
}
window.addEventListener('resize', resize);

// ===== Hạt bụi =====
class Dust {
  constructor(target) {
    this.targetX = target.x;
    this.targetY = target.y;
    // Bắt đầu từ khắp nơi trong không gian rộng
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.max(width, height) * (0.8 + Math.random() * 1.5);
    this.x = cx + Math.cos(angle) * dist;
    this.y = cy + Math.sin(angle) * dist;
    this.vx = 0;
    this.vy = 0;
    this.size = Math.random() * 1.5 + 0.5;
    // Màu: trắng, hồng nhạt, hồng đậm
    const r = Math.random();
    if (r < 0.4) {
      this.color = `hsla(0, 0%, 100%, 1)`;                    // trắng
    } else if (r < 0.75) {
      this.color = `hsla(${330 + Math.random() * 20}, 100%, 85%, 1)`; // hồng nhạt
    } else {
      this.color = `hsla(${340 + Math.random() * 15}, 100%, 65%, 1)`; // hồng đậm
    }
    this.alpha = Math.random() * 0.5 + 0.5;
    this.arrived = false;
    this.flicker = Math.random() * Math.PI * 2;
    this.flickerSpeed = 0.05 + Math.random() * 0.05;
  }

  update() {
    if (!this.arrived) {
      const dx = this.targetX - this.x;
      const dy = this.targetY - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Lực hút mượt
      const force = 0.008;
      this.vx += dx * force;
      this.vy += dy * force;

      // Ma sát để không lao quá nhanh
      this.vx *= 0.94;
      this.vy *= 0.94;

      // Tốc độ tối đa
      const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      const maxSpeed = 8;
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }

      this.x += this.vx;
      this.y += this.vy;

      if (dist < 2) {
        this.arrived = true;
      }
    } else {
      // Sau khi tụ, dao động nhẹ
      this.flicker += this.flickerSpeed;
      this.x = this.targetX + Math.sin(this.flicker) * 1.2;
      this.y = this.targetY + Math.cos(this.flicker * 1.3) * 1.2;
    }
  }

  draw() {
    const a = this.arrived ? this.alpha * (0.7 + 0.3 * Math.sin(this.flicker)) : this.alpha;
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.shadowBlur = this.arrived ? 8 : 4;
    ctx.shadowColor = this.color;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

const dusts = [];

function initDusts() {
  dusts.length = 0;
  for (let i = 0; i < heartTargets.length; i++) {
    dusts.push(new Dust(heartTargets[i]));
  }
}

// ===== Sao băng nền =====
class ShootingStar {
  constructor() { this.reset(); }
  reset() {
    if (Math.random() < 0.5) {
      this.x = -50;
      this.y = Math.random() * height * 0.5;
    } else {
      this.x = Math.random() * width * 0.5;
      this.y = -50;
    }
    this.vx = 3 + Math.random() * 4;
    this.vy = 1.5 + Math.random() * 2.5;
    this.len = 60 + Math.random() * 80;
    this.size = 0.8 + Math.random() * 1;
    this.alpha = 0.3 + Math.random() * 0.4;
    this.dead = false;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x > width + 100 || this.y > height + 100) this.dead = true;
  }
  draw() {
    const ang = Math.atan2(this.vy, this.vx);
    const tailX = this.x - Math.cos(ang) * this.len;
    const tailY = this.y - Math.sin(ang) * this.len;
    const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
    grad.addColorStop(0, `rgba(255,255,255,${this.alpha})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(tailX, tailY);
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.size;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
    ctx.fill();
  }
}

const stars = [];

// ===== Vòng lặp =====
let time = 0;
function animate() {
  time++;

  // Xóa mờ tạo vệt
  ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
  ctx.fillRect(0, 0, width, height);

  // Sao băng (thưa)
  if (time % 60 === 0 && stars.length < 3) stars.push(new ShootingStar());
  for (let i = stars.length - 1; i >= 0; i--) {
    stars[i].update();
    stars[i].draw();
    if (stars[i].dead) stars.splice(i, 1);
  }

  // Hạt bụi
  for (const d of dusts) {
    d.update();
    d.draw();
  }

  requestAnimationFrame(animate);
}

// ===== Khởi động =====
resize();
initDusts();
animate();
</script>
</body>
</html>
