<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anh Yêu Em ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', sans-serif;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .content {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; z-index: 10;
    pointer-events: none; width: 100%;
  }
  .love-text {
    font-size: clamp(2rem, 8vw, 5rem);
    color: #fff;
    text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4, 0 0 40px #ff69b4, 0 0 80px #ff69b4;
    letter-spacing: 6px; font-weight: bold;
    animation: textPulse 2s ease-in-out infinite;
    margin-bottom: 20px;
  }
  .sub-text {
    font-size: clamp(1rem, 4vw, 2rem);
    color: #ffb6d9; letter-spacing: 4px;
    text-shadow: 0 0 10px #ff69b4, 0 0 30px #ff69b4;
    animation: fadeIn 3s ease-in-out infinite;
  }
  @keyframes textPulse {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  @keyframes fadeIn {
    0%, 100% { opacity: 0.6; } 50% { opacity: 1; }
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="content">
    <h1 class="love-text">Anh Yêu Em</h1>
    <p class="sub-text">Love Như</p>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let width, height, cx, cy, heartScale;

// ===== Điểm trái tim parametric =====
function heartPoint(t, scale) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return { x: x * scale, y: -y * scale };
}

let heartPath = [];
const PATH_POINTS = 1200;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cx = width / 2;
  cy = height / 2;
  // Trái tim to: scale = min/22
  heartScale = Math.min(width, height) / 22;
  buildHeartPath();
}

function buildHeartPath() {
  heartPath = [];
  for (let i = 0; i <= PATH_POINTS; i++) {
    const t = (i / PATH_POINTS) * Math.PI * 2;
    heartPath.push(heartPoint(t, heartScale));
  }
}

window.addEventListener('resize', resize);

// ===== Sao băng =====
class ShootingStar {
  constructor() {
    this.reset();
  }
  reset() {
    // Bắt đầu từ cạnh trái hoặc trên
    if (Math.random() < 0.5) {
      this.x = -50;
      this.y = Math.random() * height * 0.6;
    } else {
      this.x = Math.random() * width * 0.8;
      this.y = -50;
    }
    this.vx = 4 + Math.random() * 6;
    this.vy = 2 + Math.random() * 4;
    this.len = 80 + Math.random() * 120;
    this.size = 1 + Math.random() * 1.5;
    this.alpha = 0.5 + Math.random() * 0.5;
    this.color = Math.random() < 0.5 ? '#ffffff' : '#ffb6d9';
    this.dead = false;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x > width + 100 || this.y > height + 100) this.dead = true;
  }
  draw() {
    const ang = Math.atan2(this.vy, this.vx);
    const tailX = this.x - Math.cos(ang) * this.len;
    const tailY = this.y - Math.sin(ang) * this.len;

    const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
    grad.addColorStop(0, `rgba(255,255,255,${this.alpha})`);
    grad.addColorStop(0.4, `rgba(255,182,217,${this.alpha * 0.5})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(tailX, tailY);
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.size;
    ctx.lineCap = 'round';
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Đầu sao
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
  }
}

const shootingStars = [];
function spawnShootingStar() {
  if (shootingStars.length < 5) {
    shootingStars.push(new ShootingStar());
  }
}

// ===== Hạt chạy quanh viền trái tim =====
class HeartParticle {
  constructor() {
    this.progress = Math.random() * PATH_POINTS;
    this.speed = 2 + Math.random() * 3;
    this.size = Math.random() * 1.5 + 0.8;
    // Màu hồng nhạt
    this.color = `hsla(${330 + Math.random() * 20}, 100%, ${75 + Math.random() * 15}%, 0.9)`;
    this.trace = [];
    this.traceMax = 20 + Math.floor(Math.random() * 20);
    // Độ lệch để tạo dải dày
    this.offset = (Math.random() - 0.5) * 60;
    this.delay = Math.random() * 150;
    this.active = false;
  }

  update(time) {
    if (time < this.delay) return;
    this.active = true;

    this.progress += this.speed;
    if (this.progress >= PATH_POINTS) {
      this.progress -= PATH_POINTS;
      this.trace = [];
    }

    const idx = Math.floor(this.progress);
    const p = heartPath[idx];
    if (!p) return;

    const nextP = heartPath[(idx + 1) % PATH_POINTS];
    const dx = nextP.x - p.x;
    const dy = nextP.y - p.y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = -dy / len;
    const ny = dx / len;

    const x = cx + p.x + nx * this.offset;
    const y = cy + p.y + ny * this.offset;

    this.trace.push({ x, y });
    if (this.trace.length > this.traceMax) {
      this.trace.shift();
    }
  }

  draw() {
    if (!this.active || this.trace.length < 2) return;

    ctx.beginPath();
    ctx.moveTo(this.trace[0].x, this.trace[0].y);
    for (let i = 1; i < this.trace.length; i++) {
      ctx.lineTo(this.trace[i].x, this.trace[i].y);
    }
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.8;
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    const head = this.trace[this.trace.length - 1];
    ctx.beginPath();
    ctx.arc(head.x, head.y, this.size * 1.8, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

const particles = [];
// Tăng số hạt lên 800 cho trái tim dày
const PARTICLE_COUNT = 800;

function initParticles() {
  particles.length = 0;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new HeartParticle());
  }
}

// ===== Vòng lặp =====
let time = 0;
let starTimer = 0;

function animate() {
  time++;
  starTimer++;

  // Sao băng: spawn mỗi ~30 frame
  if (starTimer % 30 === 0) spawnShootingStar();

  // Xóa mờ tạo vệt
  ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
  ctx.fillRect(0, 0, width, height);

  // Vẽ sao băng
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.update();
    s.draw();
    if (s.dead) shootingStars.splice(i, 1);
  }

  // Vẽ hạt trái tim
  for (const p of particles) {
    p.update(time);
    p.draw();
  }

  requestAnimationFrame(animate);
}

resize();
initParticles();
animate();
</script>
</body>
</html>
