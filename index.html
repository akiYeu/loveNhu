<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anh Yêu Em ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', sans-serif;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
    width: 100%;
  }
  .love-text {
    font-size: clamp(2rem, 8vw, 5rem);
    color: #fff;
    text-shadow:
      0 0 10px #ff0033,
      0 0 20px #ff0033,
      0 0 40px #ff0033,
      0 0 80px #ff0033;
    letter-spacing: 6px;
    font-weight: bold;
    animation: textPulse 2s ease-in-out infinite;
    margin-bottom: 20px;
  }
  .sub-text {
    font-size: clamp(1rem, 4vw, 2rem);
    color: #ff6688;
    letter-spacing: 4px;
    text-shadow:
      0 0 10px #ff0033,
      0 0 30px #ff0033;
    animation: fadeIn 3s ease-in-out infinite;
  }
  @keyframes textPulse {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  @keyframes fadeIn {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="content">
    <h1 class="love-text">Anh Yêu Em</h1>
    <p class="sub-text">Love Như</p>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let width, height, cx, cy, heartScale;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cx = width / 2;
  cy = height / 2;
  heartScale = Math.min(width, height) / 32;
}
resize();
window.addEventListener('resize', () => { resize(); buildHeartPoints(); });

// ===== Hàm tạo hình trái tim =====
function heartPoint(t, scale) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x: x * scale, y: -y * scale };
}

// ===== Danh sách điểm trên viền trái tim =====
let heartPoints = [];
const HEART_POINTS_COUNT = 500;

function buildHeartPoints() {
  heartPoints = [];
  for (let i = 0; i < HEART_POINTS_COUNT; i++) {
    const t = (i / HEART_POINTS_COUNT) * Math.PI * 2;
    heartPoints.push(heartPoint(t, heartScale));
  }
}
buildHeartPoints();

// ===== Hạt tạo dải băng =====
class Particle {
  constructor() {
    // Bắt đầu từ ngoài màn hình
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.max(width, height) * (1 + Math.random());
    this.x = cx + Math.cos(angle) * dist;
    this.y = cy + Math.sin(angle) * dist;
    this.vx = 0;
    this.vy = 0;
    this.size = Math.random() * 1.8 + 0.8;
    // Màu: trắng hoặc đỏ đan xen
    this.color = Math.random() < 0.5
      ? `hsla(0, 0%, 100%, 1)`          // trắng
      : `hsla(0, 100%, 50%, 1)`;         // đỏ
    this.trace = [];
    // Điểm đích trên trái tim
    this.targetIndex = Math.floor(Math.random() * heartPoints.length);
    // Tốc độ xoáy
    this.orbitSpeed = (Math.random() - 0.5) * 0.05;
    this.orbitAngle = 0;
    this.orbitRadius = Math.random() * 30 + 20;
    this.arrived = false;
    this.delay = Math.random() * 100;
    this.life = 0;
  }

  update(time) {
    if (time < this.delay) return;

    if (!this.arrived) {
      // Điểm đích
      const target = heartPoints[this.targetIndex];
      const tx = cx + target.x;
      const ty = cy + target.y;

      // Lực hút
      const dx = tx - this.x;
      const dy = ty - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);

      // Bay theo đường xoáy ốc
      this.orbitAngle += this.orbitSpeed;
      const offsetX = Math.cos(this.orbitAngle) * this.orbitRadius;
      const offsetY = Math.sin(this.orbitAngle) * this.orbitRadius;

      const targetX = tx + offsetX;
      const targetY = ty + offsetY;

      const dx2 = targetX - this.x;
      const dy2 = targetY - this.y;

      const force = 0.01;
      this.vx += dx2 * force;
      this.vy += dy2 * force;

      // Tăng tốc
      this.vx *= 1.03;
      this.vy *= 1.03;

      // Giới hạn tốc độ
      const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      const maxSpeed = 25;
      if (speed > maxSpeed) {
        this.vx = (this.vx / speed) * maxSpeed;
        this.vy = (this.vy / speed) * maxSpeed;
      }

      this.x += this.vx;
      this.y += this.vy;

      if (dist < 4) {
        this.arrived = true;
      }
    } else {
      // Sau khi đến đích, giữ nguyên
      this.life++;
      const target = heartPoints[this.targetIndex];
      this.x = cx + target.x;
      this.y = cy + target.y;
    }

    // Lưu vệt
    this.trace.push({ x: this.x, y: this.y });
    if (this.trace.length > 25) {
      this.trace.shift();
    }
  }

  draw() {
    // Vẽ vệt dài
    if (this.trace.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trace[0].x, this.trace[0].y);
      for (let i = 1; i < this.trace.length; i++) {
        ctx.lineTo(this.trace[i].x, this.trace[i].y);
      }
      ctx.strokeStyle = this.color;
      ctx.lineWidth = this.size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.globalAlpha = 0.6;
      ctx.shadowBlur = 10;
      ctx.shadowColor = this.color;
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    }

    // Vẽ đầu hạt
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 1.2, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

const particles = [];
const PARTICLE_COUNT = 600;

for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push(new Particle());
}

// ===== Vòng lặp =====
let time = 0;
function animate() {
  time++;

  // Xóa mờ tạo vệt sáng
  ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
  ctx.fillRect(0, 0, width, height);

  for (const p of particles) {
    p.update(time);
    p.draw();
  }

  requestAnimationFrame(animate);
}
animate();

// ===== Click tạo tim =====
document.addEventListener('click', (e) => {
  for (let i = 0; i < 12; i++) {
    const heart = document.createElement('div');
    heart.textContent = '❤️';
    heart.style.position = 'fixed';
    heart.style.left = e.clientX + 'px';
    heart.style.top = e.clientY + 'px';
    heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
    heart.style.pointerEvents = 'none';
    heart.style.zIndex = '999';
    heart.style.transition = 'all 1.5s ease-out';
    heart.style.opacity = '1';
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.style.transform = `translate(${(Math.random() - 0.5) * 400}px, -${Math.random() * 400 + 100}px) scale(0) rotate(${Math.random() * 720}deg)`;
      heart.style.opacity = '0';
    }, 10);

    setTimeout(() => heart.remove(), 1500);
  }
});
</script>
</body>
</html>
