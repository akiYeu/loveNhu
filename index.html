<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❤️ Love Neon ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, #1a0033 0%, #0d001a 50%, #000 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      position: relative;
    }

    /* Ánh sáng nền */
    .glow-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 0, 128, 0.15), transparent 70%);
      animation: pulseBg 4s ease-in-out infinite;
    }

    @keyframes pulseBg {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Trái tim chính */
    .heart-container {
      position: relative;
      z-index: 10;
      text-align: center;
    }

    .heart {
      width: 200px;
      height: 200px;
      position: relative;
      animation: heartbeat 1.2s ease-in-out infinite;
      filter: drop-shadow(0 0 30px #ff006e) drop-shadow(0 0 60px #ff006e);
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      top: 0;
      width: 100px;
      height: 160px;
      background: linear-gradient(135deg, #ff006e, #ff4d94);
      border-radius: 100px 100px 0 0;
    }

    .heart::before {
      left: 100px;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }

    .heart::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.1); }
      50% { transform: scale(1); }
      75% { transform: scale(1.15); }
    }

    /* Text */
    .love-text {
      margin-top: 50px;
      font-size: 2.5rem;
      color: #fff;
      text-shadow:
        0 0 10px #ff006e,
        0 0 20px #ff006e,
        0 0 40px #ff006e,
        0 0 80px #ff006e;
      animation: textPulse 2s ease-in-out infinite;
      letter-spacing: 4px;
    }

    @keyframes textPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    .sub-text {
      margin-top: 20px;
      font-size: 1rem;
      color: #ff9ec7;
      letter-spacing: 2px;
      animation: fadeIn 3s ease-in-out infinite;
    }

    @keyframes fadeIn {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Tim bay */
    .floating-hearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .floating-hearts span {
      position: absolute;
      bottom: -50px;
      font-size: 1.5rem;
      animation: floatUp linear infinite;
      opacity: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Ánh sáng di chuyển */
    .sparkle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff006e, 0 0 20px #ff006e;
      animation: sparkleMove 5s linear infinite;
    }

    @keyframes sparkleMove {
      0% {
        transform: translate(0, 0);
        opacity: 0;
      }
      50% { opacity: 1; }
      100% {
        transform: translate(100px, -100px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>

  <div class="heart-container">
    <div class="heart"></div>
    <h1 class="love-text">YÊU EM ❤️</h1>
    <p class="sub-text">Trái tim này chỉ dành cho em</p>
  </div>

  <div class="floating-hearts" id="floatingHearts"></div>

  <script>
    // Tạo tim bay
    const heartsContainer = document.getElementById('floatingHearts');
    const heartEmojis = ['❤️', '💖', '💕', '💗', '💓', '💞', '🌸', '✨'];

    function createFloatingHeart() {
      const span = document.createElement('span');
      span.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      span.style.left = Math.random() * 100 + '%';
      span.style.animationDuration = (Math.random() * 5 + 5) + 's';
      span.style.fontSize = (Math.random() * 20 + 15) + 'px';
      span.style.animationDelay = Math.random() * 2 + 's';
      heartsContainer.appendChild(span);

      setTimeout(() => span.remove(), 12000);
    }

    setInterval(createFloatingHeart, 300);

    // Tạo sparkle
    function createSparkle() {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.left = Math.random() * 100 + '%';
      sparkle.style.top = Math.random() * 100 + '%';
      sparkle.style.animationDuration = (Math.random() * 3 + 2) + 's';
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 5000);
    }

    setInterval(createSparkle, 500);

    // Click để tạo thêm tim
    document.addEventListener('click', (e) => {
      for (let i = 0; i < 5; i++) {
        const heart = document.createElement('span');
        heart.textContent = '💖';
        heart.style.position = 'fixed';
        heart.style.left = e.clientX + 'px';
        heart.style.top = e.clientY + 'px';
        heart.style.fontSize = '30px';
        heart.style.pointerEvents = 'none';
        heart.style.zIndex = '999';
        heart.style.transition = 'all 1.5s ease-out';
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.style.transform = `translate(${(Math.random() - 0.5) * 300}px, -300px) scale(0)`;
          heart.style.opacity = '0';
        }, 10);

        setTimeout(() => heart.remove(), 1500);
      }
    });
  </script>
</body>
</html>
