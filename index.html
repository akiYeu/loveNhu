<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Birthday Như ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #010003;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    /* LANDING SCREEN */
    #landing-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: radial-gradient(circle at center, #1a0022 0%, #010003 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #landing-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .card {
      background: rgba(25, 0, 30, 0.65);
      border: 1px solid rgba(255, 0, 102, 0.5);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 40px 30px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 0 50px rgba(230, 0, 90, 0.4);
      max-width: 340px;
      width: 85%;
    }
    .card h1 {
      font-size: 1.7rem;
      margin-bottom: 10px;
      color: #fff;
      text-shadow: 0 0 15px #ff0066;
    }
    .card p {
      font-size: 0.9rem;
      color: #ddd;
      margin-bottom: 25px;
    }
    .btn-enter {
      background: linear-gradient(90deg, #ff0066, #9900aa);
      border: none;
      color: white;
      padding: 12px 30px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 0, 102, 0.7);
      transition: transform 0.2s;
    }
    .btn-enter:active {
      transform: scale(0.96);
    }

    /* CONTROL PANEL */
    #control-panel {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 100;
      background: rgba(20, 0, 25, 0.75);
      border: 1px solid rgba(255, 0, 102, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 15px;
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(255, 0, 102, 0.25);
      width: 200px;
    }
    .control-group {
      margin-bottom: 10px;
    }
    .control-group:last-child {
      margin-bottom: 0;
    }
    .control-group label {
      display: block;
      font-size: 0.7rem;
      color: #ff88cc;
      margin-bottom: 4px;
      font-weight: bold;
    }
    .control-group input[type="color"] {
      width: 100%;
      height: 28px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }
    .control-group input[type="range"] {
      width: 100%;
      cursor: pointer;
      accent-color: #ff0066;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    /* WISH MODAL */
    #wish-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      padding: 20px;
    }
    #wish-modal.active {
      opacity: 1;
      visibility: visible;
    }
    .wish-card {
      background: rgba(30, 5, 38, 0.95);
      border: 2px solid #ff0066;
      padding: 30px 25px;
      border-radius: 24px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 0 50px rgba(255, 0, 102, 0.6);
      position: relative;
      transform: scale(0.8);
      transition: transform 0.4s ease;
    }
    #wish-modal.active .wish-card {
      transform: scale(1);
    }
    .wish-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #ff3399;
      box-shadow: 0 0 25px #ff0066;
      object-fit: cover;
      margin-bottom: 15px;
    }
    .wish-title {
      color: #ff3399;
      font-size: 1.35rem;
      margin-bottom: 12px;
      text-shadow: 0 0 12px #ff0066;
    }
    .wish-text {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #f0f0f0;
      margin-bottom: 22px;
    }
    .close-btn {
      position: absolute;
      top: 12px;
      right: 18px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.8rem;
      cursor: pointer;
    }
    .close-btn:hover { color: #fff; }

    /* LOADING */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 1001;
      background: #010003;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ff3399;
      font-size: 1.2rem;
    }
    #loading.hidden { display: none; }
  </style>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- LOADING -->
  <div id="loading">⏳ Đang tải vũ trụ...</div>

  <!-- LANDING -->
  <div id="landing-screen">
    <div class="card">
      <h1>HAPPY BIRTHDAY NHƯ ❤️</h1>
      <p>Bấm nút bên dưới để mở quà</p>
      <button class="btn-enter" onclick="startExperience()">KHÁM PHÁ VŨ TRỤ ✨</button>
    </div>
  </div>

  <!-- CONTROL PANEL -->
  <div id="control-panel">
    <div class="control-group">
      <label>Màu Tim Trung Tâm</label>
      <input type="color" id="heartColorPicker" value="#ff0066" oninput="updateHeartColor(this.value)">
    </div>
    <div class="control-group">
      <label>Màu Tim Bay</label>
      <input type="color" id="floatingColorPicker" value="#ff0066" oninput="updateFloatingColor(this.value)">
    </div>
    <div class="control-group">
      <label>Độ Sáng</label>
      <input type="range" id="contrastSlider" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateContrast(this.value)">
    </div>
  </div>

  <!-- MODAL -->
  <div id="wish-modal">
    <div class="wish-card">
      <button class="close-btn" onclick="closeWishModal()">&times;</button>
      <img id="modal-img" src="" class="wish-img" alt="Avatar">
      <h2 id="modal-title" class="wish-title">HAPPY BIRTHDAY! ❤️</h2>
      <p id="modal-text" class="wish-text"></p>
      <button class="btn-enter" onclick="closeWishModal()">Cảm ơn ❤️</button>
    </div>
  </div>

  <!-- AUDIO -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://assets.mixkit.co/music/preview/mixkit-happy-birthday-to-you-437.mp3" type="audio/mpeg">
  </audio>

  <div id="canvas-container"></div>

  <script>
    // ====== LỜI CHÚC (ĐỔI ẢNH THÀNH CỦA NHƯ) ======
    const wishesData = [
      {
        img: "https://i.postimg.cc/J4y3gHs7/1.jpg", // 👈 ĐỔI LINK ẢNH NHƯ VÀO ĐÂY
        title: "Lời Chúc Rực Rỡ ✨",
        text: "Chúc Như một tuổi mới thật rực rỡ, luôn giữ nụ cười tươi rạng rỡ và gặt hái thêm nhiều thành công mới!"
      },
      {
        img: "https://i.postimg.cc/8zMRk8BC/2.jpg", // 👈 ĐỔI LINK ẢNH NHƯ VÀO ĐÂY
        title: "Ngọt Ngào & Hạnh Phúc 💖",
        text: "Mong rằng mỗi ngày trong tuổi mới của Như đều ngập tràn niềm vui, sự ngọt ngào và những ký ức tuyệt vời."
      },
      {
        img: "https://i.postimg.cc/fbsxJHB7/3.jpg", // 👈 ĐỔI LINK ẢNH NHƯ VÀO ĐÂY
        title: "Tỏa Sáng Tinh Tú 🌟",
        text: "Như luôn là ngôi sao tỏa sáng nhất. Hãy luôn tự tin, mạnh mẽ bước tiếp và theo đuổi ước mơ của mình nhé!"
      },
      {
        img: "https://i.postimg.cc/vmv59WKd/4.jpg", // 👈 ĐỔI LINK ẢNH NHƯ VÀO ĐÂY
        title: "Tuổi Mới Bình An 🎂",
        text: "Happy Birthday Như! Chúc Như có một ngày sinh nhật thật ấm áp bên người thân yêu, luôn xinh đẹp và may mắn!"
      }
    ];

    // ====== PHÁT HIỆN MOBILE ======
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || window.innerWidth < 768;

    // ====== SỐ LƯỢNG HẠT (TỐI ƯU) ======
    const CONFIG = {
      heartCount: isMobile ? 5000 : 15000,
      galaxyCount: isMobile ? 10000 : 30000,
      floatingCount: isMobile ? 60 : 120,
      shootingStarCount: isMobile ? 8 : 15,
      pixelRatio: isMobile ? 1 : Math.min(window.devicePixelRatio, 2)
    };

    // ====== KHỞI TẠO ======
    let scene, camera, renderer, controls, mainGroup;
    let heartGeo, heartMat, heartPoints;
    let galaxyGeo, galaxyMat, galaxyPoints;
    let floatingGeo, floatingMat, floatingPoints;
    let shootingStars = [];
    let photoSprites = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let pointerDownPos = null;

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 3.5, 7.5);

      renderer = new THREE.WebGLRenderer({ antialias: !isMobile, alpha: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(CONFIG.pixelRatio);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.enablePan = false;
      controls.minDistance = 4;
      controls.maxDistance = 15;

      mainGroup = new THREE.Group();
      scene.add(mainGroup);

      // Load xong → ẩn loading
      document.getElementById('loading').classList.add('hidden');

      createHeart();
      createGalaxy();
      createFloatingHearts();
      createShootingStars();
      createPhotoSprites();
      createTextRing();

      animate();
    }

    // ====== TEXTURE HẠT NEON ======
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, 'rgba(255,255,255,1)');
      g.addColorStop(0.3, 'rgba(255,255,255,0.8)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }
    const particleTexture = createGlowTexture();

    // ====== TRÁI TIM 3D ======
    function createHeart() {
      heartGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(CONFIG.heartCount * 3);
      const colors = new Float32Array(CONFIG.heartCount * 3);

      for (let i = 0; i < CONFIG.heartCount; i++) {
        let x, y, z, inside = false;
        while (!inside) {
          x = (Math.random() - 0.5) * 2.6;
          y = (Math.random() - 0.5) * 2.6;
          z = (Math.random() - 0.5) * 2.6;
          const a = x*x + (9/4)*y*y + z*z - 1;
          if (a*a*a - x*x*z*z*z - (9/80)*y*y*z*z*z <= 0) inside = true;
        }
        pos[i*3] = x * 1.15;
        pos[i*3+1] = z * 1.15 + 1.1;
        pos[i*3+2] = y * 1.15;
        colors[i*3] = 1.0;
        colors[i*3+1] = 0.0;
        colors[i*3+2] = 0.4;
      }

      heartGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      heartGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      heartMat = new THREE.PointsMaterial({
        size: isMobile ? 0.06 : 0.045,
        map: particleTexture,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      heartPoints = new THREE.Points(heartGeo, heartMat);
      mainGroup.add(heartPoints);

      gsap.to(heartPoints.scale, {
        x: 1.08, y: 1.08, z: 1.08,
        duration: 0.8, repeat: -1, yoyo: true, ease: "power1.inOut"
      });
    }

    // ====== DẢI NGÂN HÀ ======
    function createGalaxy() {
      galaxyGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(CONFIG.galaxyCount * 3);
      const colors = new Float32Array(CONFIG.galaxyCount * 3);

      for (let i = 0; i < CONFIG.galaxyCount; i++) {
        const r = Math.pow(Math.random(), 2.2) * 10;
        const spin = r * 1.4;
        const branch = ((i % 3) / 3) * Math.PI * 2;
        pos[i*3] = Math.cos(branch + spin) * r + (Math.random() - 0.5) * 0.4;
        pos[i*3+1] = (Math.random() - 0.5) * 0.2;
        pos[i*3+2] = Math.sin(branch + spin) * r + (Math.random() - 0.5) * 0.4;
        colors[i*3] = 0.5;
        colors[i*3+1] = 0.1;
        colors[i*3+2] = 0.9;
      }

      galaxyGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      galaxyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      galaxyMat = new THREE.PointsMaterial({
        size: isMobile ? 0.05 : 0.035,
        map: particleTexture,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      galaxyPoints = new THREE.Points(galaxyGeo, galaxyMat);
      mainGroup.add(galaxyPoints);
    }

    // ====== SAO BĂNG 3D ======
    function createShootingStars() {
      // Tạo texture vệt sáng
      const trailTex = (() => {
        const c = document.createElement('canvas');
        c.width = 128; c.height = 16;
        const ctx = c.getContext('2d');
        const g = ctx.createLinearGradient(0, 0, 128, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.7, 'rgba(255,182,217,0.6)');
        g.addColorStop(1, 'rgba(255,255,255,1)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 128, 16);
        return new THREE.CanvasTexture(c);
      })();

      for (let i = 0; i < CONFIG.shootingStarCount; i++) {
        const mat = new THREE.SpriteMaterial({
          map: trailTex,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          opacity: 0.8
        });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(1.2, 0.15, 1);

        // Random vị trí + hướng
        const star = {
          sprite,
          x: (Math.random() - 0.5) * 30,
          y: 5 + Math.random() * 10,
          z: (Math.random() - 0.5) * 30,
          vx: 0.15 + Math.random() * 0.25,
          vy: -0.05 - Math.random() * 0.1,
          vz: (Math.random() - 0.5) * 0.15,
          resetDelay: Math.random() * 500
        };
        sprite.position.set(star.x, star.y, star.z);
        sprite.userData = star;
        scene.add(sprite);
        shootingStars.push(star);
      }
    }

    // ====== TRÁI TIM BAY ======
    function createHeartTexture(hexColor) {
      const c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = hexColor;
      ctx.beginPath();
      ctx.moveTo(32, 20);
      ctx.bezierCurveTo(32, 14, 24, 6, 14, 6);
      ctx.bezierCurveTo(2, 6, 2, 22, 2, 22);
      ctx.bezierCurveTo(2, 36, 18, 48, 32, 58);
      ctx.bezierCurveTo(46, 48, 62, 36, 62, 22);
      ctx.bezierCurveTo(62, 22, 62, 6, 50, 6);
      ctx.bezierCurveTo(40, 6, 32, 14, 32, 20);
      ctx.fill();
      return new THREE.CanvasTexture(c);
    }

    function createFloatingHearts() {
      floatingGeo = new THREE.BufferGeometry();
      const pos = new Float32Array(CONFIG.floatingCount * 3);
      for (let i = 0; i < CONFIG.floatingCount; i++) {
        pos[i*3] = (Math.random() - 0.5) * 16;
        pos[i*3+1] = -5 + Math.random() * 10;
        pos[i*3+2] = (Math.random() - 0.5) * 16;
      }
      floatingGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

      floatingMat = new THREE.PointsMaterial({
        size: 0.2,
        map: createHeartTexture("#ff0066"),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: 0.85
      });

      floatingPoints = new THREE.Points(floatingGeo, floatingMat);
      scene.add(floatingPoints);
    }

    // ====== ẢNH SPRITE ======
    function createPhotoSprites() {
      const photoPositions = [
        { r: 2.3, angle: 0.8, y: 0.25 },
        { r: 3.7, angle: 2.4, y: 0.35 },
        { r: 4.9, angle: 4.2, y: 0.20 },
        { r: 6.0, angle: 5.6, y: 0.40 }
      ];

      wishesData.forEach((wish, i) => {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 512;
        const ctx = c.getContext('2d');
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = wish.img;
        img.onload = () => {
          ctx.clearRect(0, 0, 512, 512);
          ctx.beginPath();
          ctx.arc(256, 256, 240, 0, Math.PI * 2);
          ctx.fillStyle = "#ff0066";
          ctx.fill();
          ctx.save();
          ctx.beginPath();
          ctx.arc(256, 256, 222, 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(img, 0, 0, 512, 512);
          ctx.restore();

          const tex = new THREE.CanvasTexture(c);
          tex.needsUpdate = true;
          const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
          const sprite = new THREE.Sprite(mat);
          sprite.scale.set(0.85, 0.85, 1);

          const p = photoPositions[i];
          sprite.position.set(Math.cos(p.angle) * p.r, p.y, Math.sin(p.angle) * p.r);
          sprite.userData = { index: i };

          mainGroup.add(sprite);
          photoSprites.push(sprite);

          gsap.to(sprite.position, {
            y: sprite.position.y + 0.15,
            duration: 1.8 + i * 0.3,
            repeat: -1, yoyo: true, ease: "sine.inOut"
          });
        };
      });
    }

    // ====== CHỮ 3D ======
    function createTextRing() {
      function makeTextSprite(text) {
        const c = document.createElement('canvas');
        c.width = 512; c.height = 64;
        const ctx = c.getContext('2d');
        ctx.font = "Bold 26px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "#ff0066";
        ctx.shadowBlur = 12;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, c.width / 2, c.height / 2);
        const tex = new THREE.CanvasTexture(c);
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(2.2, 0.45, 1);
        return sprite;
      }

      ["HAPPY BIRTHDAY NHƯ", "🎂 HAPPY BIRTHDAY 🎂"].forEach((txt, idx) => {
        const s = makeTextSprite(txt);
        const angle = idx * Math.PI;
        s.position.set(Math.cos(angle) * 4.8, 0, Math.sin(angle) * 4.8);
        mainGroup.add(s);
      });
    }

    // ====== UPDATE MÀU ======
    function updateHeartColor(hex) {
      const color = new THREE.Color(hex);
      const colors = heartGeo.attributes.color.array;
      for (let i = 0; i < CONFIG.heartCount; i++) {
        colors[i*3] = color.r;
        colors[i*3+1] = color.g;
        colors[i*3+2] = color.b;
      }
      heartGeo.attributes.color.needsUpdate = true;
    }

    function updateFloatingColor(hex) {
      if (floatingMat.map) floatingMat.map.dispose();
      floatingMat.map = createHeartTexture(hex);
      floatingMat.needsUpdate = true;
    }

    function updateContrast(val) {
      heartMat.size = (isMobile ? 0.06 : 0.045) * val;
      galaxyMat.size = (isMobile ? 0.05 : 0.035) * val;
      floatingMat.opacity = Math.min(1.0, 0.5 * val);
    }

    // ====== CLICK VS DRAG ======
    function setupInteraction() {
      renderer.domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY };
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        if (!pointerDownPos) return;
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 8 && !e.target.closest('#control-panel')) {
          mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const hits = raycaster.intersectObjects(photoSprites);
          if (hits.length > 0) {
            openWishModal(hits[0].object.userData.index);
          }
        }
        pointerDownPos = null;
      });
    }

    // ====== MODAL ======
    function openWishModal(index) {
      const d = wishesData[index];
      document.getElementById('modal-img').src = d.img;
      document.getElementById('modal-title').innerText = d.title;
      document.getElementById('modal-text').innerText = d.text;
      document.getElementById('wish-modal').classList.add('active');
    }
    function closeWishModal() {
      document.getElementById('wish-modal').classList.remove('active');
    }

    function startExperience() {
      document.getElementById('landing-screen').classList.add('hidden');
      const audio = document.getElementById('bg-music');
      if (audio) audio.play().catch(e => console.log("Audio:", e));
    }

    // ====== ANIMATION LOOP ======
    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const delta = Math.min((now - lastTime) / 16.67, 2);
      lastTime = now;

      mainGroup.rotation.y += 0.0025 * delta;

      // Trái tim bay lên
      if (floatingGeo) {
        const arr = floatingGeo.attributes.position.array;
        for (let i = 0; i < CONFIG.floatingCount; i++) {
          arr[i*3+1] += (0.015 + (i % 10) * 0.002) * delta;
          if (arr[i*3+1] > 6) {
            arr[i*3+1] = -5;
            arr[i*3] = (Math.random() - 0.5) * 16;
            arr[i*3+2] = (Math.random() - 0.5) * 16;
          }
        }
        floatingGeo.attributes.position.needsUpdate = true;
      }

      // Sao băng
      shootingStars.forEach(s => {
        s.x += s.vx * delta;
        s.y += s.vy * delta;
        s.z += s.vz * delta;
        s.sprite.position.set(s.x, s.y, s.z);

        // Reset khi ra khỏi màn hình
        if (s.y < -10 || s.x > 20 || s.x < -20) {
          s.x = (Math.random() - 0.5) * 30;
          s.y = 10 + Math.random() * 5;
          s.z = (Math.random() - 0.5) * 30;
          s.vx = 0.15 + Math.random() * 0.25;
          s.vy = -0.05 - Math.random() * 0.1;
        }
      });

      controls.update();
      renderer.render(scene, camera);
    }

    // ====== RESIZE ======
    window.addEventListener('resize', () => {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ====== FALLBACK ======
    window.addEventListener('load', () => {
      if (typeof THREE === 'undefined') {
        document.body.innerHTML = '<div style="color:#fff;text-align:center;padding:50px;font-size:1.2rem;">⚠️ Không tải được thư viện. Kiểm tra mạng và tải lại trang.</div>';
        return;
      }
      init();
      setupInteraction();
    });
  </script>
</body>
</html>
