<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anh Yêu Em ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', sans-serif;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .content {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; z-index: 10;
    pointer-events: none; width: 100%;
  }
  .love-text {
    font-size: clamp(2rem, 8vw, 5rem);
    color: #fff;
    text-shadow: 0 0 10px #ff0033, 0 0 20px #ff0033, 0 0 40px #ff0033, 0 0 80px #ff0033;
    letter-spacing: 6px; font-weight: bold;
    animation: textPulse 2s ease-in-out infinite;
    margin-bottom: 20px;
  }
  .sub-text {
    font-size: clamp(1rem, 4vw, 2rem);
    color: #ff6688; letter-spacing: 4px;
    text-shadow: 0 0 10px #ff0033, 0 0 30px #ff0033;
    animation: fadeIn 3s ease-in-out infinite;
  }
  @keyframes textPulse {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  @keyframes fadeIn {
    0%, 100% { opacity: 0.6; } 50% { opacity: 1; }
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="content">
    <h1 class="love-text">Anh Yêu Em</h1>
    <p class="sub-text">Love Như</p>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let width, height, cx, cy, heartScale;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cx = width / 2;
  cy = height / 2;
  heartScale = Math.min(width, height) / 35;
  buildHeartPath();
}
window.addEventListener('resize', resize);

// ===== Tạo đường viền trái tim =====
let heartPath = [];
const PATH_POINTS = 1000;

function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return { x: cx + x * heartScale, y: cy - y * heartScale };
}

function buildHeartPath() {
  heartPath = [];
  for (let i = 0; i <= PATH_POINTS; i++) {
    const t = (i / PATH_POINTS) * Math.PI * 2;
    heartPath.push(heartPoint(t));
  }
}

// ===== Particle chạy dọc viền trái tim =====
class Particle {
  constructor() {
    this.progress = Math.random() * PATH_POINTS; // vị trí trên đường
    this.speed = 3 + Math.random() * 4;          // tốc độ chạy
    this.size = Math.random() * 1.5 + 0.8;
    // Trắng hoặc đỏ
    this.color = Math.random() < 0.5
      ? `hsla(0, 0%, 100%, 0.9)`
      : `hsla(0, 100%, 50%, 0.9)`;
    this.trace = [];
    this.traceMax = 15 + Math.floor(Math.random() * 15);
    // Lệch nhẹ khỏi viền để tạo dải dày
    this.offset = (Math.random() - 0.5) * 30;
    // Random thời gian trễ để hạt xuất hiện dần
    this.delay = Math.random() * 200;
    this.active = false;
  }

  update(time) {
    if (time < this.delay) return;
    this.active = true;

    // Chạy dọc theo đường trái tim
    this.progress += this.speed;
    if (this.progress >= PATH_POINTS) {
      this.progress -= PATH_POINTS;
      this.trace = []; // reset trace khi hết vòng
    }

    const idx = Math.floor(this.progress);
    const p = heartPath[idx];
    if (!p) return;

    // Tính pháp tuyến để offset
    const nextP = heartPath[(idx + 1) % PATH_POINTS];
    const dx = nextP.x - p.x;
    const dy = nextP.y - p.y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const nx = -dy / len;
    const ny = dx / len;

    const x = p.x + nx * this.offset;
    const y = p.y + ny * this.offset;

    this.trace.push({ x, y });
    if (this.trace.length > this.traceMax) {
      this.trace.shift();
    }
  }

  draw() {
    if (!this.active || this.trace.length < 2) return;

    // Vẽ vệt
    ctx.beginPath();
    ctx.moveTo(this.trace[0].x, this.trace[0].y);
    for (let i = 1; i < this.trace.length; i++) {
      ctx.lineTo(this.trace[i].x, this.trace[i].y);
    }
    ctx.strokeStyle = this.color;
    ctx.lineWidth = this.size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.globalAlpha = 0.7;
    ctx.shadowBlur = 12;
    ctx.shadowColor = this.color;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // Đầu hạt sáng
    const head = this.trace[this.trace.length - 1];
    ctx.beginPath();
    ctx.arc(head.x, head.y, this.size * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ===== Tạo 400 hạt =====
const particles = [];
const PARTICLE_COUNT = 400;

function init() {
  particles.length = 0;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(new Particle());
  }
}

// ===== Vòng lặp =====
let time = 0;
function animate() {
  time++;

  // Xóa mờ tạo vệt sáng
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, width, height);

  for (const p of particles) {
    p.update(time);
    p.draw();
  }

  requestAnimationFrame(animate);
}

resize();
init();
animate();
</script>
</body>
</html>
