<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anh Yêu Em ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', sans-serif;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
    width: 100%;
  }
  .love-text {
    font-size: clamp(2rem, 8vw, 5rem);
    color: #fff;
    text-shadow:
      0 0 10px #ff0033,
      0 0 20px #ff0033,
      0 0 40px #ff0033,
      0 0 80px #ff0033;
    letter-spacing: 6px;
    font-weight: bold;
    animation: textPulse 2s ease-in-out infinite;
    margin-bottom: 20px;
  }
  .sub-text {
    font-size: clamp(1rem, 4vw, 2rem);
    color: #ff6688;
    letter-spacing: 4px;
    text-shadow:
      0 0 10px #ff0033,
      0 0 30px #ff0033;
    animation: fadeIn 3s ease-in-out infinite;
  }
  @keyframes textPulse {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  @keyframes fadeIn {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="content">
    <h1 class="love-text">Anh Yêu Em</h1>
    <p class="sub-text">Love Như</p>
  </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let width, height, cx, cy, heartScale;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cx = width / 2;
  cy = height / 2;
  heartScale = Math.min(width, height) / 35;
}
resize();
window.addEventListener('resize', () => { resize(); buildHeart(); });

// ===== Hàm tạo hình trái tim =====
function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return { x: cx + x * heartScale, y: cy - y * heartScale };
}

// ===== Tạo danh sách điểm trái tim =====
let heartPoints = [];
const HEART_POINTS_COUNT = 400;

function buildHeart() {
  heartPoints = [];
  for (let i = 0; i < HEART_POINTS_COUNT; i++) {
    const t = (i / HEART_POINTS_COUNT) * Math.PI * 2;
    heartPoints.push(heartPoint(t));
  }
  // Thêm điểm bên trong trái tim
  for (let i = 0; i < HEART_POINTS_COUNT * 0.5; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = Math.random() * 0.9;
    const x = 16 * Math.pow(Math.sin(t), 3) * r;
    const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * r;
    heartPoints.push({ x: cx + x * heartScale, y: cy - y * heartScale });
  }
}
buildHeart();

// ===== Config =====
const TRACE_COUNT = 20; // độ dài vệt
const TRACE_K = 0.4;
const TIME_DELTA = 0.01;

// ===== Particles =====
const particles = [];
const PARTICLES_COUNT = 800;

for (let i = 0; i < PARTICLES_COUNT; i++) {
  const target = heartPoints[Math.floor(Math.random() * heartPoints.length)];
  // Bắt đầu từ ngoài màn hình
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.max(width, height) * (1 + Math.random());
  particles.push({
    x: cx + Math.cos(angle) * dist,
    y: cy + Math.sin(angle) * dist,
    vx: 0,
    vy: 0,
    targetX: target.x,
    targetY: target.y,
    speed: Math.random() * 3 + 2,
    // Màu: hồng nhạt (light 60-90%) hoặc đỏ (light 40-60%)
    color: Math.random() < 0.5
      ? `hsla(0, 100%, ${60 + Math.random() * 30}%, 1)`  // đỏ tươi
      : `hsla(340, 100%, ${70 + Math.random() * 25}%, 1)`, // hồng nhạt
    trace: [],
    size: Math.random() * 1.5 + 0.8,
    arrived: false,
    // Random thời gian trễ để hạt bay không đều
    delay: Math.random() * 300
  });
}

// ===== Vẽ vệt =====
function drawTrace(p) {
  if (p.trace.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(p.trace[0].x, p.trace[0].y);
  for (let i = 1; i < p.trace.length; i++) {
    ctx.lineTo(p.trace[i].x, p.trace[i].y);
  }
  ctx.strokeStyle = p.color;
  ctx.lineWidth = p.size;
  ctx.lineCap = 'round';
  ctx.globalAlpha = 0.7;
  ctx.shadowBlur = 8;
  ctx.shadowColor = p.color;
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}

// ===== Cập nhật particle =====
function updateParticle(p, time) {
  if (time < p.delay) return;

  if (!p.arrived) {
    const dx = p.targetX - p.x;
    const dy = p.targetY - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    // Lực hút tăng dần
    const force = 0.008;
    p.vx += dx * force;
    p.vy += dy * force;

    // Tăng tốc
    p.vx *= 1.02;
    p.vy *= 1.02;

    // Giới hạn tốc độ
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    const maxSpeed = 30;
    if (speed > maxSpeed) {
      p.vx = (p.vx / speed) * maxSpeed;
      p.vy = (p.vy / speed) * maxSpeed;
    }

    p.x += p.vx * p.speed * 0.3;
    p.y += p.vy * p.speed * 0.3;

    if (dist < 3) {
      p.arrived = true;
      p.x = p.targetX;
      p.y = p.targetY;
    }
  } else {
    // Sau khi đến đích, chỉ giữ nguyên
    p.x = p.targetX + (Math.random() - 0.5) * 0.5;
    p.y = p.targetY + (Math.random() - 0.5) * 0.5;
  }

  // Cập nhật trace
  p.trace.push({ x: p.x, y: p.y });
  if (p.trace.length > TRACE_COUNT) {
    p.trace.shift();
  }
}

// ===== Vòng lặp =====
let time = 0;
function animate() {
  time += 1;

  // Xóa mờ (tạo vệt sáng lâu)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, width, height);

  for (const p of particles) {
    updateParticle(p, time);
    drawTrace(p);

    // Vẽ đầu hạt
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = p.color;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  requestAnimationFrame(animate);
}
animate();

// ===== Click tạo tim =====
document.addEventListener('click', (e) => {
  for (let i = 0; i < 12; i++) {
    const heart = document.createElement('div');
    heart.textContent = '❤️';
    heart.style.position = 'fixed';
    heart.style.left = e.clientX + 'px';
    heart.style.top = e.clientY + 'px';
    heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
    heart.style.pointerEvents = 'none';
    heart.style.zIndex = '999';
    heart.style.transition = 'all 1.5s ease-out';
    heart.style.opacity = '1';
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.style.transform = `translate(${(Math.random() - 0.5) * 400}px, -${Math.random() * 400 + 100}px) scale(0) rotate(${Math.random() * 720}deg)`;
      heart.style.opacity = '0';
    }, 10);

    setTimeout(() => heart.remove(), 1500);
  }
});
</script>
</body>
</html>
